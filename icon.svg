<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#f4efe6"/>
    <!-- a yellow derpy duck's head, close up, running off the bottom of the tile -->
    <circle cx="256" cy="312" r="226" fill="#ffd23f"/>
    <!-- soft highlight -->
    <path d="M118 210c18-46 56-80 104-94" fill="none" stroke="#ffe68a" stroke-width="20" stroke-linecap="round"/>
    <!-- one cowlick -->
    <path d="M250 92c-14-30-6-60 22-70-6 22-2 40 10 54 6-18 22-28 40-26-16 12-22 28-22 46z" fill="#ffd23f"/>
    <!-- googly eyes, mismatched, looking two ways -->
    <circle cx="174" cy="236" r="58" fill="#fff" stroke="#3a2c14" stroke-width="7"/>
    <circle cx="150" cy="250" r="22" fill="#2a2233"/>
    <circle cx="340" cy="222" r="44" fill="#fff" stroke="#3a2c14" stroke-width="7"/>
    <circle cx="356" cy="208" r="17" fill="#2a2233"/>
    <!-- cheeks -->
    <ellipse cx="128" cy="338" rx="30" ry="16" fill="#ffad5c" opacity=".55"/>
    <ellipse cx="392" cy="330" rx="30" ry="16" fill="#ffad5c" opacity=".55"/>
    <!-- wide flat bill, hanging a little open -->
    <path d="M150 330c30-30 182-34 214-4 18 18-10 40-50 44-50 6-110 6-140-6-26-10-36-22-24-34z" fill="#ff9a2e"/>
    <path d="M184 372c26 40 116 42 140 2-40 10-100 10-140-2z" fill="#e8741a"/>
    <ellipse cx="254" cy="386" rx="28" ry="12" fill="#f06a6a"/>
    <!-- nostrils -->
    <circle cx="230" cy="322" r="5" fill="#c85d10"/>
    <circle cx="282" cy="320" r="5" fill="#c85d10"/>
  </g>
</svg>
