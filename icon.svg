<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
<clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
<radialGradient id="sky" cx=".5" cy=".35" r=".8"><stop offset="0" stop-color="#ece6ff"/><stop offset="1" stop-color="#a99ee6"/></radialGradient>
<radialGradient id="head" cx=".6" cy=".28" r=".85"><stop offset="0" stop-color="#ffe98a"/><stop offset=".5" stop-color="#ffcf3a"/><stop offset="1" stop-color="#e99a12"/></radialGradient>
<linearGradient id="bill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffab45"/><stop offset="1" stop-color="#f07a1c"/></linearGradient>
<linearGradient id="jaw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e5701a"/><stop offset="1" stop-color="#c2550e"/></linearGradient>
</defs>
<g clip-path="url(#tile)">
<rect width="512" height="512" fill="url(#sky)"/>
<!-- head and neck, three-quarter view, running off the bottom -->
<path d="M120 512 C116 448 92 410 92 330 C92 200 176 120 280 120 C376 120 436 192 436 276 C436 352 392 396 360 430 C340 452 336 484 340 512 Z" fill="url(#head)"/>
<!-- tuft -->
<path d="M262 124 C246 92 252 62 282 46 C276 70 282 88 296 100 C300 76 318 62 344 62 C326 78 320 100 322 128 Z" fill="#ffd84d"/>
<!-- soft shade under the jaw -->
<path d="M150 420 C210 452 300 450 360 420 C344 446 338 478 340 512 L124 512 C122 476 112 446 100 420 Z" fill="#e48f10" opacity=".35"/>
<!-- lower bill, hanging open -->
<path d="M262 330 C320 344 410 346 470 330 C470 360 440 392 384 398 C320 404 278 380 262 350 Z" fill="url(#jaw)"/>
<ellipse cx="370" cy="368" rx="42" ry="14" fill="#ff7f8f"/>
<!-- upper bill -->
<path d="M250 300 C270 262 330 254 400 262 C452 268 488 286 486 310 C484 332 450 340 400 338 C330 336 274 336 250 300 Z" fill="url(#bill)"/>
<path d="M300 280 C340 270 400 272 440 284" stroke="#ffcf8a" stroke-width="8" stroke-linecap="round" fill="none" opacity=".7"/>
<ellipse cx="420" cy="292" rx="6" ry="4" fill="#b8500c"/>
<ellipse cx="452" cy="296" rx="5" ry="3.5" fill="#b8500c"/>
<!-- eyes: near one big, far one small, looking two ways -->
<circle cx="268" cy="214" r="44" fill="#fff"/>
<circle cx="252" cy="226" r="24" fill="#1b1a2e"/>
<circle cx="260" cy="216" r="8" fill="#fff"/>
<circle cx="384" cy="196" r="30" fill="#fff"/>
<circle cx="396" cy="184" r="16" fill="#1b1a2e"/>
<circle cx="401" cy="178" r="5.5" fill="#fff"/>
<!-- cheek -->
<ellipse cx="196" cy="296" rx="30" ry="17" fill="#ff8fab" opacity=".55"/>
<!-- highlight -->
<path d="M150 214 C164 176 196 148 236 136" stroke="#fff6c8" stroke-width="14" stroke-linecap="round" fill="none" opacity=".75"/>
</g>
</svg>
